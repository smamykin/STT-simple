[package]
name = "stt-simple"
version = "0.1.0"
description = "Private desktop dictation using your OpenAI API key"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "stt_simple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stt-core = { path = "../crates/stt-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
cpal = "0.15"
tokio = { version = "1", features = ["sync", "time", "process", "io-util"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
glib = "0.18.5"
gtk = "0.18.2"
nix = { version = "0.29", features = ["signal", "process"] }
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
core-graphics = { version = "=0.25.0", default-features = false, features = ["link"] }
macos-accessibility-client = "=0.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
